name: Painel Deconto (pacote do servidor)

on:
  push:
    paths:
      - "painel/**"
      - "sistema-carlise/frota.html"
      - "munck/munck.html"
      - ".github/workflows/painel-deconto.yml"
      - "estoque/estoque.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o programa do servidor
        run: |
          node --check painel/servidor/servidor.js
          node --check painel/servidor/sistemas.js
          node --check painel/servidor/banco.js
          node --check painel/servidor/paginas.js
          bash -n painel/servidor/instalar-no-servidor.sh
          node --check painel/servidor/estoque.js

      - name: Testes do servidor
        run: node --test painel/testes/servidor.test.js painel/testes/estoque-servidor.test.js

      - name: Montar o pacote
        run: bash painel/servidor/montar-pacote.sh dist

      - name: Publicar para download (pré-lançamento "painel-deconto")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=painel-deconto
          NOTAS="Pacote para instalar o Painel Deconto num servidor Linux (Ubuntu ou Debian). Passo a passo em painel/servidor/LEIA-ME.md."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "$GITHUB_SHA" --prerelease --title "Painel Deconto (servidor)" --notes "$NOTAS"
          gh release upload "$TAG" --clobber dist/painel-deconto-servidor.tar.gz
