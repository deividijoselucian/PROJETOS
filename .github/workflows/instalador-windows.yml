name: Instalador Windows (teste)

on:
  push:
    paths:
      - "central-acionamentos/**"
      - ".github/workflows/instalador-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Gerar o instalador e o .zip da extensão
        run: bash central-acionamentos/instalador/build.sh

      - name: Guardar os arquivos
        uses: actions/upload-artifact@v4
        with:
          name: CentralAcionamentos-Teste
          path: |
            central-acionamentos/instalador/dist/CentralAcionamentos-Teste-Setup.exe
            central-acionamentos/instalador/dist/CentralAcionamentos-Extensao.zip

      - name: Publicar para download (pré-lançamento "instalador-teste")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=instalador-teste
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Central de Acionamentos (instalador de teste)" \
            --notes "Versão de teste. Baixe CentralAcionamentos-Teste-Setup.exe (instalador para Windows) ou só a extensão em CentralAcionamentos-Extensao.zip."
          gh release upload "$TAG" --clobber \
            central-acionamentos/instalador/dist/CentralAcionamentos-Teste-Setup.exe \
            central-acionamentos/instalador/dist/CentralAcionamentos-Extensao.zip
