name: DECONT (programa para Windows)

on:
  push:
    paths:
      - "sistema-carlise/**"
      - ".github/workflows/sistema-carlise.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Gerar DECONT.exe
        run: bash sistema-carlise/exe/build.sh

      - name: Guardar o arquivo
        uses: actions/upload-artifact@v4
        with:
          name: DECONT
          path: sistema-carlise/exe/dist/DECONT.exe

      - name: Publicar para download (pré-lançamento "sistema-carlise")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=sistema-carlise
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "$GITHUB_SHA" --prerelease \
            --title "DECONT (programa para Windows)" \
            --notes "Baixe DECONT.exe e abra. Ele cria o atalho DECONT na Área de Trabalho."
          gh release edit "$TAG" --title "DECONT (programa para Windows)" \
            --notes "Baixe DECONT.exe e abra. Ele cria o atalho DECONT na Área de Trabalho."
          gh release delete-asset "$TAG" SistemaCarlise.exe -y 2>/dev/null || true
          gh release upload "$TAG" --clobber sistema-carlise/exe/dist/DECONT.exe
