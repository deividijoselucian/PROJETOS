name: Controle Munck (pacote do servidor)

on:
  push:
    paths:
      - "munck/**"
      - ".github/workflows/controle-munck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o programa do servidor
        run: |
          node --check munck/servidor/servidor.js
          bash -n munck/servidor/instalar-no-servidor.sh

      - name: Montar o pacote
        run: bash munck/servidor/montar-pacote.sh dist

      - name: Publicar para download (pré-lançamento "controle-munck")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=controle-munck
          NOTAS="Pacote para instalar o Controle Munck num servidor Linux (Ubuntu ou Debian). Passo a passo em munck/servidor/LEIA-ME.md."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "$GITHUB_SHA" --prerelease --title "Controle Munck (servidor)" --notes "$NOTAS"
          gh release upload "$TAG" --clobber dist/controle-munck-servidor.tar.gz
